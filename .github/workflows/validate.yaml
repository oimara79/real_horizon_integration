name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS integration
        uses: hacs/action@main
        with:
          category: integration
          # A license is needed for the default HACS store, not custom-repository installation.
          ignore: license

  validate-hassfest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master
